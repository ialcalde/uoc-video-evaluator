# ─────────────────────────────────────────────────────────────────────────────
# UOC Video Evaluator — Evaluation Criteria Configuration
#
# This file is sourced by video-evaluator.sh as a bash script.
# All values are optional; uncomment and adjust to override the built-in defaults.
# ─────────────────────────────────────────────────────────────────────────────

# ── Duration (seconds) ────────────────────────────────────────────────────────
MIN_DURATION_SEC=30       # Minimum accepted video length
MAX_DURATION_SEC=3600     # Maximum accepted video length (1 hour)

# ── Resolution (pixels) ───────────────────────────────────────────────────────
MIN_WIDTH=640             # Minimum frame width  (e.g. 640 for 480p)
MIN_HEIGHT=360            # Minimum frame height (e.g. 360 for 480p)
MAX_WIDTH=3840            # Maximum frame width  (e.g. 3840 for 4K)
MAX_HEIGHT=2160           # Maximum frame height (e.g. 2160 for 4K)

# ── Video bitrate (kbps) ─────────────────────────────────────────────────────
MIN_VIDEO_BITRATE_KBPS=200    # Floor to catch heavily compressed files
MAX_VIDEO_BITRATE_KBPS=50000  # Ceiling (50 Mbps)

# ── Frame rate ────────────────────────────────────────────────────────────────
MIN_FPS=15    # Minimum acceptable frames per second
MAX_FPS=120   # Maximum acceptable frames per second

# ── Allowed video codecs ──────────────────────────────────────────────────────
# Space-separated list of ffprobe codec_name values
ALLOWED_VIDEO_CODECS="h264 hevc vp8 vp9 av1"

# ── Audio settings ────────────────────────────────────────────────────────────
REQUIRE_AUDIO=true        # Set to false if audio track is optional

# Space-separated list of allowed audio codec names
ALLOWED_AUDIO_CODECS="aac mp3 opus vorbis flac pcm_s16le pcm_s24le"

MIN_AUDIO_SAMPLE_RATE=22050   # Hz (22050 = half of CD quality)
MIN_AUDIO_CHANNELS=1          # 1 = mono, 2 = stereo

# ── Container / file format ───────────────────────────────────────────────────
# Space-separated list of allowed container short names (ffprobe format_name substrings)
ALLOWED_CONTAINERS="mp4 mkv webm mov avi"

# ── File size limit ───────────────────────────────────────────────────────────
MAX_FILE_SIZE_MB=0   # 0 disables the check; set e.g. 500 to enforce a 500 MB cap
